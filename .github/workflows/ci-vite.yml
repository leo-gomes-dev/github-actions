name: CI/CD - Vite para GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Permissões necessárias para o GitHub Actions publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # JOB 1: Validação e Testes (CI)
  qualidade-e-testes:
    name: 1. Verificar Código e Dependências
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: echo "Testes unitários aprovados!"

  # JOB 2: Build de Produção (CI)
  build-producao:
    name: 2. Gerar Build do Vite
    runs-on: ubuntu-latest
    needs: qualidade-e-testes

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Gerar Build com Secrets
        env:
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_AMBIENTE: "producao"
        run: npm run build

      - name: Empacotar pasta 'dist' para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # JOB 3: Deploy em Produção + Aviso no Discord (CD)
  deploy-producao:
    name: 3. Publicar no GitHub Pages
    runs-on: ubuntu-latest
    needs: build-producao
    # Só faz deploy se for um push direto na main (ignora Pull Requests abertos)
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar site no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notificar no Discord com o link no ar
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"🚀 **Deploy concluído com sucesso!**\n📦 **Projeto:** ${{ github.repository }}\n📊 **Status:** ${{ job.status }}\n🌐 **Acesse o site no ar:** $SITE_URL\"}" \
               "$WEBHOOK_URL"
