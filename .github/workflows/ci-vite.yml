name: CI - Projeto Vite Vanilla

# Roda em qualquer push na main ou quando alguém abrir um Pull Request
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # JOB 1: Validação e Testes
  qualidade-e-testes:
    name: Verificar Código e Dependências
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar o código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (com cache para ser mais rápido)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 3. Instalar dependências (modo limpo de CI)
        run: npm ci

      - name: 4. Rodar testes (simulado até você adicionar Vitest/Jest)
        run: echo "Rodando suíte de testes unitários... Tudo OK!"

  # JOB 2: Build de Produção (Só roda se o Job 1 passar!)
  build-producao:
    name: Gerar Build do Vite
    runs-on: ubuntu-latest
    needs: qualidade-e-testes # Cria dependência entre os jobs

    steps:
      - name: 1. Baixar o código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 3. Instalar dependências
        run: npm ci

      - name: 4. Validar Secrets e Gerar Build (dist)
        env:
          # Aqui puxamos a Secret do GitHub para dentro da máquina virtual
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_AMBIENTE: "producao"
        run: |
          echo "Verificando variáveis injetadas..."
          if [ -z "$VITE_API_KEY" ]; then
            echo "ERRO: VITE_API_KEY não foi configurada!"
            exit 1
          fi
          echo "Secret detectada com sucesso! (O GitHub mascara o valor como ***)"
          echo "Valor mascarado: $VITE_API_KEY"
          npm run build

      - name: 5. Salvar a pasta 'dist' gerada (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: build-vite-pronto
          path: dist/
